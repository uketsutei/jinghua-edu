<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册 | 菁华教育网课平台</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="logo" href="index.html">
        <span class="logo-mark">菁</span>
        <span class="logo-text"><b>菁华教育</b><i>JINGHUA EDU</i></span>
      </a>

      <div class="auth-copy">
        <h1>让每一节课<br />都落到分数上</h1>
        <p>登录后即可免费试听任意课程的第一节完整课时，学习进度、课堂笔记与作业记录都会自动保存。</p>
        <div class="auth-points">
          <div><i class="tick">✓</i> 320+ 门精品课程随时回看</div>
          <div><i class="tick">✓</i> 作业逐题批改，助教 12 小时内响应</div>
          <div><i class="tick">✓</i> 每周直播答疑，问题当堂解决</div>
          <div><i class="tick">✓</i> 学习进度对家长透明可见</div>
        </div>
      </div>

      <div class="auth-foot">© 2026 菁华教育科技（上海）有限公司</div>
    </aside>

    <main class="auth-main">
      <div class="auth-box">
        <h2 id="formTitle">欢迎回来</h2>
        <p class="hint" id="formHint">使用手机号登录，继续你的学习计划。</p>

        <form id="authForm" novalidate>
          <div class="field hide" id="nameField">
            <label for="name">姓名</label>
            <input id="name" type="text" placeholder="请输入你的称呼" autocomplete="name" />
            <div class="err" id="nameErr"></div>
          </div>

          <div class="field">
            <label for="phone">手机号</label>
            <div class="phone-row">
              <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel" />
              <button class="btn btn-outline" type="button" id="sendCode">获取验证码</button>
            </div>
            <div class="err" id="phoneErr"></div>
          </div>

          <div class="field hide" id="codeField">
            <label for="code">验证码</label>
            <input id="code" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码" autocomplete="one-time-code" />
            <div class="err" id="codeErr"></div>
          </div>

          <div class="field" id="pwdField">
            <label for="pwd">密码</label>
            <input id="pwd" type="password" placeholder="请输入密码（至少 6 位）" autocomplete="current-password" />
            <div class="err" id="pwdErr"></div>
          </div>

          <div class="auth-row">
            <label><input type="checkbox" id="remember" checked /> 记住我</label>
            <a href="#" id="forgot">忘记密码？</a>
          </div>

          <button class="btn btn-primary btn-lg btn-block" style="margin-top:22px" type="submit" id="submitBtn">
            登录
          </button>
        </form>

        <div class="auth-switch">
          <span id="switchText">还没有账号？</span>
          <button id="switchBtn" type="button">免费注册</button>
        </div>

        <div class="demo-tip">
          这是演示站点，不会真实发送短信或扣款。也可以直接
          <button id="demoBtn" style="color:#0e7c66;font-weight:700;text-decoration:underline">使用体验账号进入</button>
          ，立即查看完整的学习中心。
        </div>

        <p style="margin-top:20px;font-size:13.5px;text-align:center">
          <a href="index.html" style="color:var(--muted)">← 返回首页</a>
        </p>
      </div>
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/content-overrides.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rawNext = params.get("next") || "";
    const next = /^[\w.-]+\.html(\?.*)?$/.test(rawNext) || rawNext === "checkout" ? rawNext : "";

    let mode = params.get("mode") === "register" ? "register" : "login";
    let cloud = false;

    const els = {
      title: document.getElementById("formTitle"),
      hint: document.getElementById("formHint"),
      nameField: document.getElementById("nameField"),
      name: document.getElementById("name"),
      phone: document.getElementById("phone"),
      pwd: document.getElementById("pwd"),
      code: document.getElementById("code"),
      codeField: document.getElementById("codeField"),
      pwdField: document.getElementById("pwdField"),
      switchText: document.getElementById("switchText"),
      switchBtn: document.getElementById("switchBtn"),
      submit: document.getElementById("submitBtn"),
      form: document.getElementById("authForm")
    };

    function paint() {
      const isLogin = mode === "login";
      els.title.textContent = isLogin ? "欢迎回来" : "创建你的学习账号";
      els.hint.textContent = cloud
        ? "输入手机号，点「获取验证码」即可登录或自动注册。"
        : isLogin
        ? "使用手机号登录，继续你的学习计划。"
        : "注册后可免费试听任意课程的第一节完整课时。";
      els.nameField.classList.toggle("hide", isLogin);
      els.codeField.classList.toggle("hide", !cloud);
      els.pwdField.classList.toggle("hide", cloud);
      els.switchText.textContent = isLogin ? "还没有账号？" : "已经有账号了？";
      els.switchBtn.textContent = isLogin ? "免费注册" : "去登录";
      els.submit.textContent = isLogin ? "登录" : "注册并开始学习";
      ["phoneErr", "pwdErr", "nameErr", "codeErr"].forEach((id) => (document.getElementById(id).textContent = ""));
    }

    function setErr(id, msg) {
      document.getElementById(id).textContent = msg || "";
    }

    function finish(user) {
      JH.state.user = user;
      JH.save();
      JH.toast(mode === "login" ? "登录成功，欢迎回来" : "注册成功，开始学习吧");
      setTimeout(() => {
        if (next === "checkout") {
          if (JH.state.cart.length) {
            JH.checkout();
          } else {
            location.href = "courses.html";
          }
          return;
        }
        location.href = next || "learning.html";
      }, 700);
    }

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = els.name.value.trim();
      const phone = els.phone.value.trim();
      const pwd = els.pwd.value;
      const code = els.code.value.trim();
      let ok = true;

      if (mode === "register" && name.length < 1) {
        setErr("nameErr", "请填写你的称呼");
        ok = false;
      }
      if (!/^1\d{10}$/.test(phone)) {
        setErr("phoneErr", "请输入 11 位有效手机号");
        ok = false;
      }
      if (cloud && !/^\d{6}$/.test(code)) {
        setErr("codeErr", "请输入 6 位验证码");
        ok = false;
      }
      if (!cloud && pwd.length < 6) {
        setErr("pwdErr", "密码至少需要 6 位");
        ok = false;
      }
      if (!ok) return;

      if (cloud) {
        els.submit.disabled = true;
        els.submit.textContent = "登录中…";
        JH_API.login(phone, code, mode === "register" ? name : "")
          .then((r) => finish({ name: r.user.name, phone: r.user.phone, id: r.user.id, cloud: true }))
          .catch((err) => {
            setErr("codeErr", err.message);
            els.submit.disabled = false;
            paint();
          });
        return;
      }

      finish({
        name: mode === "register" ? name : "同学",
        phone: phone.replace(/(\d{3})\d{4}(\d{4})/, "$1****$2")
      });
    });

    document.getElementById("sendCode").addEventListener("click", async () => {
      const phone = els.phone.value.trim();
      if (!/^1\d{10}$/.test(phone)) {
        setErr("phoneErr", "请先填写 11 位手机号");
        return;
      }
      const btn = document.getElementById("sendCode");
      btn.disabled = true;
      btn.textContent = "发送中…";
      try {
        const r = await JH_API.sendCode(phone);
        if (r.devCode) {
          els.code.value = r.devCode;
          JH.toast("演示环境验证码已自动填入：" + r.devCode);
        } else {
          JH.toast("验证码已发送");
        }
      } catch (e) {
        setErr("phoneErr", e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "获取验证码";
      }
    });

    els.switchBtn.addEventListener("click", () => {
      mode = mode === "login" ? "register" : "login";
      paint();
    });

    document.getElementById("demoBtn").addEventListener("click", () => {
      mode = "login";
      finish({ name: "体验学员", phone: "138****8888" });
    });

    document.getElementById("forgot").addEventListener("click", (e) => {
      e.preventDefault();
      JH.toast("演示站点暂不支持找回密码，请使用体验账号进入", false);
    });

    paint();

    /* 检测后端：连得上就走真实的验证码登录 */
    (async () => {
      if (!window.JH_API) return;
      cloud = await JH_API.check();
      if (cloud) {
        document.querySelector(".demo-tip").innerHTML =
          "已连接后端服务，登录信息会保存到服务器，换设备也能看到你的学习记录。";
      }
      paint();
    })();
  </script>
</body>
</html>
