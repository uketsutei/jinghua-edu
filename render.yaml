# Render 一键部署配置（Blueprint）
# 有了这个文件，Render 会自动填好启动命令、健康检查、环境变量，你只需要点「Apply」。
services:
  - type: web
    name: jinghua-edu
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: "echo 本项目零依赖，无需构建"
    startCommand: "node --experimental-sqlite server/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # 网页编辑密码：第一次部署时在 Render 界面上填你自己的密码
      - key: JH_ADMIN_KEY
        sync: false
